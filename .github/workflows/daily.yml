# The morning run: MoneyPuck windows, ratings, projections for the next week,
# partner-book prices, frozen decisions for today's slate, and grading of the
# unresolved ledger. Runs every day; an off-season day publishes ratings only.
name: daily
on:
  # Supabase pg_cron: nhl-daily-dispatch, daily at 16:15 UTC from the day
  # before opening night through April; nothing fires in the off-season.
  repository_dispatch:
    types: [nhl-daily]
  workflow_dispatch:
    inputs:
      date:
        description: Site day to run (YYYY-MM-DD, Pacific); default today
        required: false
        type: string
      players:
        description: Also refresh the player grades, whatever the weekday
        type: boolean
        default: false

concurrency:
  group: nhl-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry sync --no-interaction
      - name: Restore official results cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw/results
          key: nhl-results-${{ hashFiles('backend/backtest.py') }}
      - name: Daily run
        run: >-
          poetry run python -m backend daily --odds-wait-minutes 90
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Research only: what a morning run can know about tonight's lineups.
      # The roster endpoint serves only the present, so a rerun of a past
      # day skips it.
      - name: Log morning rosters
        if: ${{ !inputs.date }}
        run: poetry run python -m backend log-rosters --publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Retain source receipts and the day's outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-daily-${{ github.run_id }}
          path: |
            backend/data/processed/receipts
            backend/data/processed/decisions
            backend/data/processed/ratings
            backend/data/processed/projections
            backend/data/raw/quote_verification
          retention-days: 90
          if-no-files-found: ignore


  # Skater and goalie grades for the site's players page, on Mondays and
  # Thursdays. They read no forecast and feed none, so the job runs after the
  # morning run whatever its outcome. Shift charts and MoneyPuck player files
  # are kept in a rolling cache; only new games are fetched. A cold cache
  # refetches three seasons of shift charts, most of an hour.
  players:
    needs: run
    if: ${{ always() && !inputs.date }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Decide whether the grades are due
        id: due
        run: |
          weekday=$(date -u +%u)
          if [ "$weekday" = 1 ] || [ "$weekday" = 4 ] || [ "${{ inputs.players }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install poetry
        if: steps.due.outputs.run == 'true'
        run: pipx install poetry
      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: poetry sync --no-interaction
      - name: Restore player source cache
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            backend/data/raw/shifts
            backend/data/raw/skater_logs
            backend/data/raw/shot_logs
            backend/data/raw/goalies
          key: nhl-player-sources-${{ github.run_id }}
          restore-keys: nhl-player-sources-
      - name: Player grades
        if: steps.due.outputs.run == 'true'
        run: poetry run python -m backend player-grades --publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
