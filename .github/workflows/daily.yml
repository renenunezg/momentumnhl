# The morning run: MoneyPuck windows, ratings, projections for the next week,
# partner-book prices, frozen decisions for today's slate, and grading of the
# last few days. Runs every day; an off-season day publishes ratings only.
name: daily
on:
  # Supabase pg_cron: nhl-daily-dispatch, daily at 16:15 UTC from the day
  # before opening night through April; nothing fires in the off-season.
  repository_dispatch:
    types: [nhl-daily]
  workflow_dispatch:
    inputs:
      date:
        description: Site day to run (YYYY-MM-DD, Pacific); default today
        required: false
        type: string

concurrency:
  group: nhl-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry sync --no-interaction
      - name: Restore official results cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw/results
          key: nhl-results-${{ hashFiles('backend/backtest.py') }}
      - name: Daily run
        run: >-
          poetry run python -m backend daily --odds-wait-minutes 90
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Retain source receipts and the day's outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-daily-${{ github.run_id }}
          path: |
            backend/data/processed/receipts
            backend/data/processed/decisions
            backend/data/raw/quote_verification
          retention-days: 90
          if-no-files-found: ignore
