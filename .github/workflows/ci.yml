name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - run: poetry sync --no-interaction
      - run: poetry run ruff check backend tests
      - name: Apply the schema to a disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c '
            create role anon; create role authenticated; create role service_role;
            create function public.site_revalidate() returns trigger language plpgsql
              as $$ begin return null; end $$;'
          psql -X -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f sql/001_nhl_schema.sql
      - run: poetry run pytest -q
